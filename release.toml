# cargo-release: bumps noesis_bevy, stamps CHANGELOG.md, commits, tags vX.Y.Z,
# and pushes. Bump derive/ first (see RELEASING.md). Private CI validates the
# tag before the public release.yml workflow publishes it.

publish = false
tag = true
tag-name = "v{{version}}"
push = true
allow-branch = ["main"]

pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "v0\\.10\\.0\\.\\.\\.HEAD", replace = "v{{version}}...HEAD", exactly = 1, min = 0 },
]
