name: Release

# Publishes noesis_bevy_derive, then noesis_bevy, when cargo-release pushes a
# vX.Y.Z tag (see RELEASING.md). Runs on the SDK runner so the full test suite
# gates the release. Both crates use crates.io Trusted Publishing, and the
# required noesis_runtime must already be on crates.io.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for crates.io Trusted Publishing (OIDC)

jobs:
  publish:
    name: publish to crates.io
    runs-on: [self-hosted, noesis-sdk]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The suites need process-per-test isolation; see tests/README.md.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run
        run: cargo nextest run --profile ci --all-targets --all-features

      # Skip a version already on crates.io so a re-run is idempotent.
      - name: Check noesis_bevy_derive published
        id: derive
        run: |
          ver=$(grep -m1 '^version' derive/Cargo.toml | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: noesis_bevy-release' \
            "https://crates.io/api/v1/crates/noesis_bevy_derive/$ver")
          [ "$code" = "200" ] && echo "skip=true" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io for the derive crate
        if: steps.derive.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: derive-auth

      - name: Publish noesis_bevy_derive
        if: steps.derive.outputs.skip != 'true'
        run: cargo publish --manifest-path derive/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.derive-auth.outputs.token }}

      - name: Check noesis_bevy published
        id: bevy
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: noesis_bevy-release' \
            "https://crates.io/api/v1/crates/noesis_bevy/$ver")
          [ "$code" = "200" ] && echo "skip=true" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io for noesis_bevy
        if: steps.bevy.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: bevy-auth

      - name: Publish noesis_bevy
        if: steps.bevy.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.bevy-auth.outputs.token }}
