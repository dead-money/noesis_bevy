name: Release
run-name: Publish ${{ inputs.tag }}

# Dispatch after private SDK validation succeeds for this exact tag and SHA.
# The operator checks the private run; its URL is recorded here for audit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Validated release tag (vX.Y.Z)
        required: true
        type: string
      sha:
        description: Full commit SHA tested by noesis-ci
        required: true
        type: string
      sdk_run:
        description: Successful private SDK validation run URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ inputs.tag }}
  EXPECTED_SHA: ${{ inputs.sha }}
  SDK_RUN: ${{ inputs.sdk_run }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_RUN" =~ ^https://github.com/dead-money/noesis-ci/actions/runs/[0-9]+$ ]]

      - name: Checkout validated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check tag identity and record SDK validation
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          derive_version=$(python3 -c 'import tomllib; print(tomllib.load(open("derive/Cargo.toml", "rb"))["package"]["version"])')
          test "$derive_version" = "$version"
          {
            echo "### $RELEASE_TAG"
            echo "- source commit: $EXPECTED_SHA"
            echo "- SDK validation checked by the release operator: $SDK_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check noesis_bevy_derive version
        id: bevy-derive
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("derive/Cargo.toml", "rb"))["package"]["version"])')
          code=$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: noesis-release' "https://crates.io/api/v1/crates/noesis_bevy_derive/$version")
          case "$code" in
            200) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP $code"; exit 1 ;;
          esac

      - name: Authenticate for noesis_bevy_derive
        if: steps.bevy-derive.outputs.skip != 'true'
        id: bevy-derive-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # noesis-ci built and tested this exact source with the licensed SDK.
      # Packaging needs no SDK; --no-verify skips repeating the native build here.
      - name: Publish noesis_bevy_derive
        if: steps.bevy-derive.outputs.skip != 'true'
        run: cargo publish --no-verify --manifest-path derive/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.bevy-derive-auth.outputs.token }}

      - name: Check noesis_bevy version
        id: bevy
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          code=$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: noesis-release' "https://crates.io/api/v1/crates/noesis_bevy/$version")
          case "$code" in
            200) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP $code"; exit 1 ;;
          esac

      - name: Authenticate for noesis_bevy
        if: steps.bevy.outputs.skip != 'true'
        id: bevy-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # noesis-ci built and tested this exact source with the licensed SDK.
      # Packaging needs no SDK; --no-verify skips repeating the native build here.
      - name: Publish noesis_bevy
        if: steps.bevy.outputs.skip != 'true'
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.bevy-auth.outputs.token }}
