name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Run JS-based actions on Node 24; Node 20 is deprecated.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The SDK jobs (all-features clippy and tests, and crates.io releases) run in
  # the private dead-money/noesis-ci repo, because the self-hosted SDK runner
  # takes no jobs from public repos. See RELEASING.md.

  # Runs everywhere, including fork PRs. No SDK needed.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

  # Catches broken intra-doc links before they reach docs.rs. DOCS_RS makes both
  # build scripts skip the native compile, so this needs no SDK and runs on hosted.
  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      DOCS_RS: "1"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Bevy's transitive build scripts (wayland-sys, alsa-sys, libudev-sys) run
      # pkg-config even under DOCS_RS, so the hosted runner needs these. The
      # self-hosted runner has them provisioned.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: cargo doc
        run: cargo doc --no-deps
