name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Run JS-based actions on Node 24; Node 20 is deprecated.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Runs everywhere, including fork PRs. No SDK needed.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

  # Catches broken intra-doc links before they reach docs.rs. DOCS_RS makes both
  # build scripts skip the native compile, so this needs no SDK and runs on hosted.
  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      DOCS_RS: "1"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Bevy's transitive build scripts (wayland-sys, alsa-sys, libudev-sys) run
      # pkg-config even under DOCS_RS, so the hosted runner needs these. The
      # self-hosted runner has them provisioned.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: cargo doc
        run: cargo doc --no-deps

  # Needs the Noesis SDK, which only the self-hosted runner has. Never run
  # fork-PR code there.
  build-test:
    name: build • clippy • test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, noesis-sdk]
    env:
      # The runner service has no login session, and winit's Wayland probe
      # errors without XDG_RUNTIME_DIR. Any writable path works.
      XDG_RUNTIME_DIR: /tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Keep target/ between runs for fast incremental builds.
          clean: false

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Keeps the examples compiling; nextest builds and runs the suites.
      - name: cargo build
        run: cargo build --all-targets --all-features

      # The suites need process-per-test isolation; see tests/README.md.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run
        run: cargo nextest run --profile ci --all-targets --all-features
