[package]
name = "noesis_bevy"
version = "0.15.1"
edition = "2024"
rust-version = "1.87"
authors = ["Brandon Reinhart <brandon@deadmoney.gg>"]
description = "Bevy plugin that drives the Noesis GUI Native SDK and renders its UIs into a Bevy frame via wgpu compositing."
repository = "https://github.com/dead-money/noesis_bevy"
documentation = "https://docs.rs/noesis_bevy"
license = "MIT"
readme = "README.md"
keywords = ["bevy", "noesis", "xaml", "gui", "ui"]
categories = ["gui", "game-development", "graphics"]
# docs/ stays for the README image; assets/ and examples/ stay for the samples.
exclude = [".github/", ".claude/", "CLAUDE.md", "TODO.md", "RELEASING.md", "release.toml"]

# docs.rs has no Noesis SDK. Both build scripts return early under DOCS_RS, so
# rustdoc builds the API without linking.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"

[features]
default = []
# Bevy's `debug` feature: system and resource names in panic messages.
debug = ["bevy/debug"]
# Dev aid: rebuild views when their XAML, dictionaries, fragments, or images
# change on disk. `notify` watches files registered with `XamlRegistry::insert`;
# Bevy's `file_watcher` covers `AssetServer`-loaded assets.
hot_reload = ["dep:notify", "bevy/file_watcher"]

[dependencies]
bevy = "0.19"
bevy_render = "0.19"
bytemuck = { version = "1.25", features = ["derive"] }
# Released in lockstep from derive/.
noesis_bevy_derive = { path = "./derive", version = "0.15" }
noesis_runtime = "0.13"
# The render device. 0.1 is the wgpu 29 line Bevy 0.19 uses.
noesis_wgpu = "0.1"
# Image decoding for the image asset loader.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The list reconciler keeps rows in collection order with O(1) lookup by Entity.
indexmap = "2"
notify = { version = "8", optional = true }
thiserror = "2"
# Must match Bevy 0.19's wgpu so Cargo unifies them and the types interoperate.
wgpu = "29.0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
# Capture `error!` events in tests (resolve to Bevy's versions).
tracing = "0.1"
tracing-subscriber = "0.3"

[lints.rust]
unsafe_code = "forbid"

# Curated lint set shared with noesis_runtime, minus its FFI-only `mem_forget`
# allowance: this crate forbids unsafe code.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
indexing_slicing = "allow"
many_single_char_names = "allow"

# `panic`: unreachable enum arms and render-device phase guards.
# `float_cmp`: exact dedup of scale values before re-issuing an FFI call
# (`NoesisRenderState::apply_live_flags`).
panic = "allow"
float_cmp = "allow"

# Correctness
unnecessary_cast = "warn"
as_underscore = "warn"
ptr_as_ptr = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
invalid_upcast_comparisons = "warn"
mixed_read_write_in_expression = "warn"
index_refutable_slice = "warn"
string_slice = "warn"

# Style
doc_markdown = "warn"
equatable_if_let = "warn"
if_not_else = "warn"
implicit_saturating_sub = "warn"
inconsistent_struct_constructor = "warn"
mismatching_type_param_order = "warn"
branches_sharing_code = "warn"
manual_assert = "warn"
mut_mut = "warn"
needless_continue = "warn"
option_option = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_else = "warn"
ref_option_ref = "warn"
unnested_or_patterns = "warn"
unneeded_field_pattern = "warn"
zero_sized_map_values = "warn"

# Perf
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"

# Reminders
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Cargo
wildcard_dependencies = "warn"

[[example]]
name = "xaml_viewer"
path = "examples/xaml_viewer.rs"

[[example]]
name = "scoreboard"
path = "examples/scoreboard.rs"

[[example]]
name = "ecs_ui"
path = "examples/ecs_ui.rs"

# Three suite binaries, run under cargo-nextest for process-per-test isolation.
# See tests/README.md.
[[test]]
name = "headless_suite"
path = "tests/headless_suite/main.rs"

[[test]]
name = "wgpu_suite"
path = "tests/wgpu_suite/main.rs"

[[test]]
name = "render_suite"
path = "tests/render_suite/main.rs"
